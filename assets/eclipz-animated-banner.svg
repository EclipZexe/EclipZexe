<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#090a0d"/>
    <stop offset="50%" stop-color="#0c1117"/>
    <stop offset="100%" stop-color="#090a0d"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="48%" r="58%">
    <stop offset="0%" stop-color="#8dbfdf" stop-opacity=".20"/>
    <stop offset="55%" stop-color="#4e85bf" stop-opacity=".06"/>
    <stop offset="100%" stop-color="#4e85bf" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" fill="none" stroke="#71899a" stroke-opacity=".05" stroke-width="1"/>
  </pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .muted{fill:#71808e}
    .text{fill:#dbe7ef}
    .accent{fill:#a6d7f4}
    .wave{fill:none;stroke:#5b91bc;stroke-width:1.2;opacity:.28}
    .wave2{fill:none;stroke:#a6d7f4;stroke-width:.8;opacity:.16}
    .dash{stroke-dasharray:8 16;animation:dash 13s linear infinite}
    .floatA{animation:floatA 8s ease-in-out infinite}
    .floatB{animation:floatB 10s ease-in-out infinite}
    .driftL{animation:driftL 18s linear infinite}
    .driftR{animation:driftR 22s linear infinite}
    .pulse{animation:pulse 4s ease-in-out infinite}
    .blink{animation:blink 1.1s steps(2,end) infinite}
    .scan{animation:scan 9s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-240}}
    @keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes floatB{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
    @keyframes driftL{0%{transform:translateX(-120px)}50%{transform:translateX(60px)}100%{transform:translateX(-120px)}}
    @keyframes driftR{0%{transform:translateX(110px)}50%{transform:translateX(-70px)}100%{transform:translateX(110px)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.95}}
    @keyframes blink{50%{opacity:0}}
    @keyframes scan{0%{transform:translateY(-12px)}100%{transform:translateY(432px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>

<rect width="1400" height="420" rx="28" fill="url(#bg)"/>
<rect width="1400" height="420" rx="28" fill="url(#grid)"/>
<ellipse cx="700" cy="210" rx="420" ry="190" fill="url(#glow)" filter="url(#blur)"/>

<g class="driftL">
  <rect x="-90" y="74" width="690" height="34" rx="9" fill="#10151a" stroke="#5d7e98" stroke-opacity=".16"/>
  <text x="-58" y="96" class="mono text" font-size="11">const idea = "build something personal";  await learn();  await create();  repeat();</text>
  <rect x="-40" y="126" width="760" height="34" rx="9" fill="#0d1114" stroke="#5d7e98" stroke-opacity=".16"/>
  <text x="-8" y="148" class="mono text" font-size="11">requestAnimationFrame(loop);  if (boring) customize();  if (broken) refactor();</text>
</g>

<g class="driftR">
  <rect x="800" y="290" width="700" height="34" rx="9" fill="#11161b" stroke="#587d95" stroke-opacity=".15"/>
  <text x="832" y="312" class="mono text" font-size="11">python assistant.py --mode creative  |  status = "building"  |  location = "Guadeloupe"</text>
  <rect x="690" y="338" width="790" height="34" rx="9" fill="#0d1318" stroke="#587d95" stroke-opacity=".15"/>
  <text x="722" y="360" class="mono text" font-size="11">git commit -m "keep improving"  |  const future = { freedom, projects, family };</text>
</g>

<path class="wave dash" d="M-30 246 C120 170 250 312 410 232 S710 165 860 246 S1160 326 1430 215"/>
<path class="wave2 dash" d="M-50 274 C110 348 300 172 470 254 S770 330 930 240 S1190 180 1450 278"/>
<path class="wave" d="M-60 185 C120 105 300 225 460 170 S770 118 930 188 S1220 248 1450 160" opacity=".15"/>
<path class="wave2" d="M-40 318 C160 240 340 378 530 304 S840 250 1020 312 S1240 372 1450 298" opacity=".12"/>

<g class="floatA">
  <text x="700" y="176" text-anchor="middle" class="mono accent" font-size="22" letter-spacing="12">3CLIPZ</text>
  <text x="700" y="210" text-anchor="middle" class="mono muted" font-size="10" letter-spacing="4">BUILD / LEARN / CREATE / REPEAT</text>
</g>

<g class="floatB">
  <rect x="552" y="236" width="296" height="46" rx="12" fill="#0a0c0f" stroke="#6f9ab8" stroke-opacity=".3"/>
  <text x="580" y="264" class="mono text" font-size="11">&gt; currently building eclipz.dev</text>
  <rect x="817" y="250" width="8" height="15" fill="#a6d7f4" class="blink"/>
</g>

<g opacity=".5">
  <circle cx="456" cy="176" r="3" fill="#a6d7f4" class="pulse"/>
  <circle cx="944" cy="176" r="3" fill="#a6d7f4" class="pulse"/>
  <path d="M465 176 H610" stroke="#6b91ac" stroke-opacity=".25"/>
  <path d="M790 176 H935" stroke="#6b91ac" stroke-opacity=".25"/>
</g>

<g class="scan" opacity=".07"><rect width="1400" height="2" fill="#dbe7ef"/></g>

<text x="34" y="392" class="mono muted" font-size="9">github.com/EclipZexe</text>
<text x="1366" y="392" text-anchor="end" class="mono muted" font-size="9">made in guadeloupe</text>
</svg>