<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#050507"/>
    <stop offset="55%" stop-color="#090812"/>
    <stop offset="100%" stop-color="#050507"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#8f7cff" stop-opacity=".22"/>
    <stop offset="60%" stop-color="#6e5cff" stop-opacity=".05"/>
    <stop offset="100%" stop-color="#6e5cff" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#7a73a7" stroke-opacity=".06" stroke-width="1"/>
  </pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  <clipPath id="leftHand">
    <path d="M15 130 C125 90 235 88 325 108 C372 118 405 142 435 167
             C465 193 480 214 489 233 C494 245 486 255 472 251
             C453 245 432 227 412 216 L360 192 L389 225
             C401 240 393 252 377 247 L328 215 L354 247
             C364 261 353 271 339 265 L291 228 L312 260
             C321 274 309 284 294 278 L249 236
             C219 210 183 195 145 187 C94 176 52 174 15 177 Z"/>
  </clipPath>
  <clipPath id="rightHand">
    <path d="M1385 138 C1280 104 1178 101 1090 119 C1044 129 1005 151 975 175
             C945 198 930 217 920 235 C913 248 921 257 936 253
             C954 248 977 232 998 221 L1050 197 L1021 229
             C1009 243 1017 255 1033 250 L1082 220 L1057 250
             C1046 264 1058 274 1072 268 L1120 233 L1099 263
             C1090 277 1102 287 1117 281 L1161 241
             C1191 215 1226 201 1264 193 C1315 182 1354 181 1385 184 Z"/>
  </clipPath>
  <style>
    .tiny{font:10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d7d4e4}
    .muted{fill:#8d89a8}
    .accent{fill:#b9aeff}
    .line{stroke:#9a8cff;stroke-width:1;fill:none;stroke-linecap:round}
    .ghost{stroke:#665e94;stroke-width:1;fill:none;opacity:.25}
    .float1{animation:f1 7s ease-in-out infinite}
    .float2{animation:f2 8.5s ease-in-out infinite}
    .pulse{animation:pulse 3.8s ease-in-out infinite}
    .blink{animation:blink 1.2s steps(2,end) infinite}
    .scan{animation:scan 8s linear infinite}
    .dash{stroke-dasharray:7 12;animation:dash 10s linear infinite}
    .codeL{animation:codeL 14s linear infinite}
    .codeR{animation:codeR 16s linear infinite}
    @keyframes f1{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes f2{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes blink{50%{opacity:0}}
    @keyframes scan{0%{transform:translateY(-20px)}100%{transform:translateY(440px)}}
    @keyframes dash{to{stroke-dashoffset:-220}}
    @keyframes codeL{0%{transform:translateX(-30px)}50%{transform:translateX(14px)}100%{transform:translateX(-30px)}}
    @keyframes codeR{0%{transform:translateX(26px)}50%{transform:translateX(-16px)}100%{transform:translateX(26px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>

<rect width="1400" height="420" rx="26" fill="url(#bg)"/>
<rect width="1400" height="420" rx="26" fill="url(#grid)"/>
<ellipse cx="700" cy="215" rx="310" ry="180" fill="url(#glow)" filter="url(#blur)"/>

<g opacity=".24">
  <path class="ghost dash" d="M84 74 C310 12 503 78 631 170"/>
  <path class="ghost dash" d="M1317 75 C1112 28 927 90 774 173"/>
  <path class="ghost dash" d="M278 362 C465 332 554 315 646 268"/>
  <path class="ghost dash" d="M1110 354 C943 332 836 311 758 268"/>
</g>

<g clip-path="url(#leftHand)" class="codeL">
  <rect x="0" y="90" width="530" height="220" fill="#11111a"/>
  <g class="tiny">
    <text x="10" y="112">const idea = "build something better";</text>
    <text x="10" y="126">while (curious) { learn(); create(); repeat(); }</text>
    <text x="10" y="140">function makeItReal(input) =&gt; ship(input);</text>
    <text x="10" y="154">git commit -m "keep building"</text>
    <text x="10" y="168">await dream.then(plan).then(build);</text>
    <text x="10" y="182">for (const problem of life) solve(problem);</text>
    <text x="10" y="196">if (boring) customize();</text>
    <text x="10" y="210">python assistant.py --mode creative</text>
    <text x="10" y="224">requestAnimationFrame(loop);</text>
    <text x="10" y="238">const future = { freedom, projects, family };</text>
    <text x="10" y="252">design(); refactor(); improve();</text>
    <text x="10" y="266">console.log("still building");</text>
  </g>
</g>

<g clip-path="url(#rightHand)" class="codeR">
  <rect x="870" y="95" width="530" height="220" fill="#11111a"/>
  <g class="tiny">
    <text x="874" y="116">export default function Eclipz() {</text>
    <text x="874" y="130">  return ideas.map(build);</text>
    <text x="874" y="144">}</text>
    <text x="874" y="158">const stack = ["python","web","automation","ui"];</text>
    <text x="874" y="172">open("possibility");</text>
    <text x="874" y="186">if (!finished) keepGoing();</text>
    <text x="874" y="200">async function improve() { await learn(); }</text>
    <text x="874" y="214">create / break / fix / repeat</text>
    <text x="874" y="228">location = "Guadeloupe";</text>
    <text x="874" y="242">status = "building";</text>
    <text x="874" y="256">goal = "make it mine";</text>
    <text x="874" y="270">return future;</text>
  </g>
</g>

<path d="M15 130 C125 90 235 88 325 108 C372 118 405 142 435 167 C465 193 480 214 489 233 C494 245 486 255 472 251 C453 245 432 227 412 216 L360 192 L389 225 C401 240 393 252 377 247 L328 215 L354 247 C364 261 353 271 339 265 L291 228 L312 260 C321 274 309 284 294 278 L249 236 C219 210 183 195 145 187 C94 176 52 174 15 177" class="line pulse" opacity=".75"/>
<path d="M1385 138 C1280 104 1178 101 1090 119 C1044 129 1005 151 975 175 C945 198 930 217 920 235 C913 248 921 257 936 253 C954 248 977 232 998 221 L1050 197 L1021 229 C1009 243 1017 255 1033 250 L1082 220 L1057 250 C1046 264 1058 274 1072 268 L1120 233 L1099 263 C1090 277 1102 287 1117 281 L1161 241 C1191 215 1226 201 1264 193 C1315 182 1354 181 1385 184" class="line pulse" opacity=".75"/>

<g class="float1">
  <text x="700" y="176" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" letter-spacing="10" class="accent">ECLIPZ</text>
  <text x="700" y="205" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="4" class="muted">BUILD / LEARN / CREATE / REPEAT</text>
</g>

<g class="float2">
  <rect x="586" y="236" width="228" height="42" rx="10" fill="#0e0d15" stroke="#675d98" stroke-opacity=".35"/>
  <text x="610" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" class="tiny">&gt; currently building</text>
  <rect x="776" y="251" width="8" height="14" fill="#b9aeff" class="blink"/>
</g>

<g opacity=".55">
  <circle cx="510" cy="214" r="3" fill="#b9aeff" class="pulse"/>
  <circle cx="890" cy="214" r="3" fill="#b9aeff" class="pulse"/>
  <path d="M516 214 H650" class="ghost"/>
  <path d="M750 214 H884" class="ghost"/>
</g>

<g class="scan" opacity=".08">
  <rect x="0" y="0" width="1400" height="2" fill="#c9c1ff"/>
</g>

<text x="36" y="382" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" class="muted">github.com/EclipZexe</text>
<text x="1364" y="382" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" class="muted">made in guadeloupe</text>
</svg>